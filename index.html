<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: data:">
<title>BlockHub</title>
<style>
:root{--bg:#0b0c10;--side:#0f1117;--card:#161922;--card2:#1d212c;--line:#242836;--txt:#eef0f6;--mut:#8b91a5;--acc:#3b82f6;--grn:#22c55e}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:grid;grid-template-columns:88px 1fr;overflow:hidden;user-select:none}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--grn));display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:18px}
.nav{width:64px;padding:10px 0;border:0;border-radius:14px;background:none;color:var(--mut);font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav small{font-size:11px}.nav:hover{background:var(--card)}.nav.on{background:var(--card2);color:var(--txt);box-shadow:inset 3px 0 0 var(--acc)}
main{display:flex;flex-direction:column;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
header h2{font-size:20px}
#acc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:12px;cursor:pointer;font:inherit}
#acc img{width:26px;height:26px;border-radius:6px}
#page{flex:1;overflow:auto;padding:0 28px 20px}
.hero{height:250px;border-radius:22px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:28px;
 background:radial-gradient(800px 380px at 85% -10%,hsl(var(--h) 85% 55%/.55),transparent),radial-gradient(500px 300px at 5% 115%,hsl(calc(var(--h) + 70) 85% 50%/.35),transparent),var(--card)}
.hero h1{font-size:44px;line-height:1.1;margin:8px 0 4px}.hero p{color:var(--mut)}
.chip{background:rgba(255,255,255,.12);padding:4px 12px;border-radius:99px;font-size:12px;backdrop-filter:blur(6px)}
.sec{margin:26px 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.card{width:176px;height:128px;border-radius:16px;padding:14px;position:relative;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;justify-content:flex-end;
 background:linear-gradient(160deg,hsl(var(--h) 60% 30%),hsl(calc(var(--h) + 40) 55% 16%));transition:.15s}
.card:hover{transform:translateY(-3px)}.card.sel{border-color:var(--grn);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
.card b{position:absolute;top:10px;left:14px;font-size:34px;opacity:.9}.card span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:#ffffffa0}
.card .x{position:absolute;top:8px;right:8px;border:0;background:#0006;color:#fff;border-radius:8px;width:24px;height:24px;cursor:pointer;opacity:0}.card:hover .x{opacity:1}
.card.add{background:var(--card);border:2px dashed var(--line);align-items:center;justify-content:center;font-size:32px;color:var(--mut)}.card.add small{font-size:12px}
footer{display:flex;align-items:center;gap:24px;padding:16px 28px;background:var(--side);border-top:1px solid var(--line)}
.info{flex:1}#stat{color:var(--mut);font-size:13px}
.pb{height:6px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--grn));transition:.2s}
.play{background:var(--grn);color:#04210f;border:0;font:800 17px inherit;letter-spacing:.06em;padding:16px 56px;border-radius:14px;cursor:pointer;box-shadow:0 8px 24px rgba(34,197,94,.3)}
.play:hover{filter:brightness(1.08)}.play:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px 14px;border-radius:12px;font:inherit;user-select:text;outline:none}
input:focus,select:focus{border-color:var(--acc)}#q{flex:1;min-width:220px}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:3px}.tabs button{border:0;background:none;color:var(--mut);padding:7px 16px;border-radius:10px;cursor:pointer;font:inherit}.tabs .on{background:var(--card2);color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.mod{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.mod img{width:58px;height:58px;border-radius:12px;background:var(--card2);object-fit:cover;flex:none}
.mod div{flex:1;min-width:0}.mod small{display:block;color:var(--mut)}.mod p{color:#b8bdd0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mod button{background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}.mod button:disabled{background:var(--card2);color:var(--mut)}
.mod.file{padding:10px 14px}.mod.file button{background:#ef4444}
.empty{color:var(--mut);padding:40px;text-align:center;grid-column:1/-1}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;width:400px;display:flex;flex-direction:column;gap:14px}
.dlg label{display:flex;flex-direction:column;gap:6px;color:var(--mut);font-size:13px}.dlg input[type=range]{padding:0}
.act{display:flex;justify-content:flex-end;gap:10px}.act button{border:0;padding:10px 20px;border-radius:12px;cursor:pointer;font:inherit;font-weight:600}
.ghost{background:var(--card2);color:var(--txt)}.go{background:var(--grn);color:#04210f}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:12px 22px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;max-width:70vw}#toast.on{opacity:1}
</style></head>
<body>
<aside><div class="logo">B</div>
 <button class="nav" data-p="home" onclick="go('home')">🎮<small>Spielen</small></button>
 <button class="nav" data-p="mods" onclick="go('mods')">🧩<small>Mods</small></button></aside>
<main>
 <header><h2 id="title"></h2><button id="acc" onclick="account()"></button></header>
 <div id="page"></div>
 <footer><div class="info"><span id="stat">Bereit</span><div class="pb"><i id="bar"></i></div></div>
  <button id="play" class="play" onclick="play()">SPIELEN</button></footer>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const st = { page:'home', insts:[], sel:null, acc:null, versions:[], tab:'find', q:'', busy:false };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue = s => [...s].reduce((a,c) => (a*31 + c.charCodeAt(0)) % 360, 7);
const cur = () => st.insts.find(i => i.id === st.sel) || st.insts[0];
const clean = e => (e.message || String(e)).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
let tt; const toast = t => { const n = $('#toast'); n.textContent = t; n.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => n.classList.remove('on'), 3500); };

async function init() {
  st.acc = await api.invoke('auth:get');
  st.insts = await api.invoke('inst:list');
  render();
  api.invoke('versions:list').then(v => st.versions = v).catch(() => toast('Versionsliste konnte nicht geladen werden'));
}
function go(p) { st.page = p; render(); }
function pick(id) { st.sel = id; render(); }

function render() {
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('on', b.dataset.p === st.page));
  $('#acc').innerHTML = st.acc ? `<img src="https://minotar.net/helm/${encodeURIComponent(st.acc.name)}/32"><span>${esc(st.acc.name)}</span>` : '🔑 Anmelden';
  $('#title').textContent = st.page === 'home' ? 'Spielen' : 'Mods';
  $('#page').innerHTML = st.page === 'home' ? home() : mods();
  const i = cur();
  if (st.page === 'mods' && i && i.loader === 'fabric') st.tab === 'find' ? search() : haveList();
}

function home() {
  const i = cur();
  const hero = i
    ? `<span class="chip">${i.loader === 'fabric' ? 'Fabric' : 'Vanilla'} · ${esc(i.mc)}</span><h1>${esc(i.name)}</h1><p>${i.ram} MB RAM</p>`
    : `<h1>Willkommen bei BlockHub</h1><p>Erstelle deine erste Instanz, um loszulegen.</p>`;
  const cards = st.insts.map(x => `<div class="card ${i && x.id === i.id ? 'sel' : ''}" style="--h:${hue(x.name)}" onclick="pick('${x.id}')">
    <b>${esc(x.name[0].toUpperCase())}</b><button class="x" onclick="event.stopPropagation();del('${x.id}')">✕</button>
    <span>${esc(x.name)}</span><small>${esc(x.mc)} · ${x.loader}</small></div>`).join('');
  return `<section class="hero" style="--h:${i ? hue(i.name) : 220}"><div>${hero}</div></section>
    <h3 class="sec">Instanzen</h3><div class="row">${cards}<div class="card add" onclick="openNew()">＋<small>Neue Instanz</small></div></div>`;
}

function mods() {
  const i = cur();
  if (!i) return `<p class="empty">Erstelle zuerst eine Instanz.</p>`;
  const sel = `<select onchange="st.sel=this.value;render()">${st.insts.map(x => `<option value="${x.id}" ${x.id === i.id ? 'selected' : ''}>${esc(x.name)} (${esc(x.mc)})</option>`).join('')}</select>`;
  if (i.loader !== 'fabric') return `<div class="bar">${sel}</div><p class="empty">Vanilla-Instanzen unterstützen keine Mods. Erstelle eine Fabric-Instanz.</p>`;
  return `<div class="bar">${sel}
    <div class="tabs"><button class="${st.tab === 'find' ? 'on' : ''}" onclick="st.tab='find';render()">Entdecken</button><button class="${st.tab === 'have' ? 'on' : ''}" onclick="st.tab='have';render()">Installiert</button></div>
    ${st.tab === 'find' ? `<input id="q" placeholder="Mods auf Modrinth suchen …" value="${esc(st.q)}" onkeydown="if(event.key==='Enter'){st.q=this.value;search()}">` : ''}</div>
    <div id="grid" class="grid"></div>`;
}

async function search() {
  const g = $('#grid'); g.innerHTML = '<p class="empty">Lade …</p>';
  try {
    const hits = await api.invoke('mods:search', { id: cur().id, q: st.q });
    const dl = n => n >= 1e6 ? (n / 1e6).toFixed(1) + ' Mio' : (n / 1e3 | 0) + ' Tsd';
    g.innerHTML = hits.map(h => `<div class="mod"><img src="${esc(h.icon_url || '')}" onerror="this.style.visibility='hidden'">
      <div><b>${esc(h.title)}</b><small>von ${esc(h.author)} · ${dl(h.downloads)} Downloads</small><p>${esc(h.description)}</p></div>
      <button onclick="getMod('${h.project_id}',this)">Installieren</button></div>`).join('') || '<p class="empty">Nichts gefunden.</p>';
  } catch (e) { g.innerHTML = `<p class="empty">${esc(clean(e))}</p>`; }
}
async function getMod(pid, btn) {
  btn.disabled = true; btn.textContent = '…';
  try { const f = await api.invoke('mods:install', { id: cur().id, pid }); btn.textContent = 'Installiert ✓'; toast(`Installiert: ${f.join(', ')}`); }
  catch (e) { btn.disabled = false; btn.textContent = 'Installieren'; toast(clean(e)); }
}
async function haveList() {
  const files = await api.invoke('mods:list', cur().id);
  $('#grid').innerHTML = files.map(f => `<div class="mod file"><div><b>${esc(f)}</b></div><button data-f="${esc(f)}" onclick="rmMod(this.dataset.f)">Löschen</button></div>`).join('') || '<p class="empty">Noch keine Mods installiert.</p>';
}
async function rmMod(file) { await api.invoke('mods:remove', { id: cur().id, file }); haveList(); }

function openNew() {
  if (!st.versions.length) return toast('Versionen werden noch geladen …');
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="dlg"><h2>Neue Instanz</h2>
    <label>Name<input id="n" value="Meine Instanz"></label>
    <label>Version<select id="v">${st.versions.map(v => `<option>${v}</option>`).join('')}</select></label>
    <label>Loader<select id="l"><option value="fabric">Fabric (für Mods)</option><option value="vanilla">Vanilla</option></select></label>
    <label>RAM: <span id="rv">4096</span> MB<input id="r" type="range" min="1024" max="16384" step="512" value="4096" oninput="$('#rv').textContent=this.value"></label>
    <div class="act"><button class="ghost" onclick="$('#modal').remove()">Abbrechen</button><button class="go" onclick="create()">Erstellen</button></div></div>`;
  document.body.append(m);
}
async function create() {
  const name = $('#n').value.trim(); if (!name) return;
  const i = await api.invoke('inst:create', { name, mc: $('#v').value, loader: $('#l').value, ram: +$('#r').value });
  $('#modal').remove(); st.insts = await api.invoke('inst:list'); st.sel = i.id; render();
}
async function del(id) {
  if (!confirm('Instanz samt Welten und Mods löschen?')) return;
  await api.invoke('inst:delete', id); st.insts = await api.invoke('inst:list'); if (st.sel === id) st.sel = null; render();
}

async function login() {
  try { st.acc = await api.invoke('auth:login'); render(); } catch (e) { toast('Login fehlgeschlagen: ' + clean(e)); }
}
async function account() {
  if (!st.acc) return login();
  if (confirm(`${st.acc.name} abmelden?`)) { await api.invoke('auth:logout'); st.acc = null; render(); }
}

function idle() { st.busy = false; $('#play').disabled = false; $('#bar').style.width = '0'; }
async function play() {
  if (st.busy) return;
  const i = cur(); if (!i) return toast('Erstelle zuerst eine Instanz.');
  if (!st.acc) { await login(); if (!st.acc) return; }
  st.busy = true; $('#play').disabled = true;
  try { await api.invoke('game:play', i.id); } catch (e) { toast(clean(e)); $('#stat').textContent = 'Fehler'; idle(); }
}
api.on('status', t => $('#stat').textContent = t);
api.on('progress', p => $('#bar').style.width = p + '%');
api.on('closed', () => { $('#stat').textContent = 'Bereit'; idle(); });
init();
</script></body></html>
